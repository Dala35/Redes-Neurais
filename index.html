<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrokódica - Redes Neurais v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #010409; color: #f8fafc; margin: 0; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .neural-bg { 
            background: radial-gradient(circle at center, #05051a 0%, #010409 100%);
        }
        .node-glow { filter: drop-shadow(0 0 12px currentColor); }
        
        /* Pulso de Sinal Real */
        .signal-particle {
            offset-path: path(var(--path));
            animation: signalFlow var(--duration) linear infinite;
        }
        @keyframes signalFlow {
            0% { offset-distance: 0%; opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        .neural-grid {
            background-image: radial-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="neural-bg">
    <div class="absolute inset-0 neural-grid pointer-events-none"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const APP_ID = "AFROKODICA-NEURAL-REALITY-2.0";

        const GUIDE_MESSAGES = [
            "O sinal viaja através do peso: quanto maior a ressonância, maior a influência.",
            "A rede não calcula, ela sente o padrão da tua intenção.",
            "Observa os caminhos brilhantes: são as autoestradas do conhecimento africano.",
            "Dispara um neurónio de entrada para ver a cascata de aprendizado.",
            "A inteligência real nasce da repetição e do fortalecimento das pontes.",
            "Sinapses em fluxo: a base para o aprendizado sem dados externos."
        ];

        function App() {
            const [nodes, setNodes] = useState([]);
            const [connections, setConnections] = useState([]);
            const [learningRate, setLearningRate] = useState(0.4);
            const [activeSignals, setActiveSignals] = useState([]);
            const [guideIndex, setGuideIndex] = useState(0);
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth >= 1024);
            const containerRef = useRef(null);

            // Inicialização da Arquitetura Neural (MEC-03)
            useEffect(() => {
                const layers = [4, 6, 5, 2]; 
                const newNodes = [];
                const newConnections = [];
                
                layers.forEach((count, layerIdx) => {
                    for (let i = 0; i < count; i++) {
                        const node = {
                            id: `n-${layerIdx}-${i}`,
                            layer: layerIdx,
                            x: 10 + layerIdx * 26, 
                            y: 15 + (i * (70 / (count - 1 || 1))), 
                            activation: 0,
                            bias: Math.random() * 0.2
                        };
                        newNodes.push(node);

                        if (layerIdx > 0) {
                            const prevLayerNodes = newNodes.filter(n => n.layer === layerIdx - 1);
                            prevLayerNodes.forEach(prevNode => {
                                newConnections.push({
                                    id: `c-${prevNode.id}-${node.id}`,
                                    from: prevNode.id,
                                    to: node.id,
                                    weight: (Math.random() * 2 - 1) * 0.8,
                                    activity: 0 // Para rastro visual de uso
                                });
                            });
                        }
                    }
                });
                setNodes(newNodes);
                setConnections(newConnections);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => setGuideIndex(prev => (prev + 1) % GUIDE_MESSAGES.length), 8000);
                return () => clearInterval(interval);
            }, []);

            // Função de Disparo (Propagação Real)
            const triggerInference = (startNodeId) => {
                const startNode = nodes.find(n => n.id === startNodeId);
                if (!startNode) return;

                // Ativar o neurónio visualmente
                setNodes(prev => prev.map(n => n.id === startNodeId ? {...n, activation: 1} : n));
                
                // Encontrar conexões de saída
                const outConns = connections.filter(c => c.from === startNodeId);
                
                const newSignals = outConns.map(conn => ({
                    id: `sig-${Date.now()}-${Math.random()}`,
                    path: `M ${startNode.x},${startNode.y} L ${nodes.find(n => n.id === conn.to).x},${nodes.find(n => n.id === conn.to).y}`,
                    to: conn.to,
                    weight: conn.weight,
                    duration: 0.8 + Math.random() * 0.4
                }));

                setActiveSignals(prev => [...prev, ...newSignals]);

                // Fortalecer os caminhos (Aprendizado Hebbiano)
                setConnections(prev => prev.map(c => {
                    if (c.from === startNodeId) {
                        return { 
                            ...c, 
                            weight: Math.min(1.5, Math.max(-1.5, c.weight + (learningRate * 0.1))),
                            activity: 1
                        };
                    }
                    return c;
                }));

                // Limpar sinais e desativar neurónio após animação
                setTimeout(() => {
                    setActiveSignals(prev => prev.filter(s => !newSignals.find(ns => ns.id === s.id)));
                    setNodes(prev => prev.map(n => n.id === startNodeId ? {...n, activation: 0} : n));
                    
                    // Propagação em cascata para a próxima camada
                    newSignals.forEach(sig => {
                        if (Math.random() > 0.5) triggerInference(sig.to);
                    });
                }, 1000);
            };

            return (
                <div className="h-screen w-full flex flex-col relative z-10 p-4 md:p-6 overflow-hidden select-none">
                    
                    {/* Header Protocolar */}
                    <header className="flex justify-between items-center z-50 mb-4 bg-black/60 backdrop-blur-2xl p-4 rounded-3xl border border-blue-500/20 shadow-2xl">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-3 hover:bg-blue-500/20 rounded-xl transition-all text-blue-400">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black tracking-tighter text-white uppercase italic leading-none flex items-center gap-2">
                                    Neural_Reality
                                    <span className="text-[10px] bg-blue-600 px-2 py-0.5 rounded-full not-italic tracking-normal">MEC-03 v2.0</span>
                                </h1>
                                <p className="text-[8px] font-mono text-blue-400 tracking-[0.3em] uppercase mt-1">Sincronia_De_Inferência_Real</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden md:block text-right">
                                <p className="text-[7px] text-slate-500 uppercase font-mono tracking-tighter">Throughput</p>
                                <p className="text-[10px] text-emerald-400 font-bold font-mono">{(activeSignals.length * 12.4).toFixed(1)} Tflops/s</p>
                            </div>
                            <div className="w-10 h-10 border border-blue-500/30 rounded-2xl flex items-center justify-center text-blue-400 text-xs font-bold bg-blue-500/10 shadow-[0_0_20px_rgba(59,130,246,0.15)]">Σ</div>
                        </div>
                    </header>

                    <div className="flex-1 flex gap-6 min-h-0 relative z-10">
                        {/* Painel de Configuração de Aprendizado */}
                        <aside className={`
                            absolute lg:relative inset-y-0 left-0 z-40 w-72 md:w-80 transition-all duration-500
                            ${isSidebarOpen ? 'translate-x-0 opacity-100' : '-translate-x-full opacity-0 lg:hidden'}
                            flex flex-col gap-6
                        `}>
                            <div className="bg-black/80 border border-white/10 p-6 rounded-[2.5rem] space-y-8 backdrop-blur-xl shadow-2xl flex-1 flex flex-col overflow-y-auto">
                                <h3 className="text-[10px] font-mono text-blue-400 uppercase tracking-widest flex items-center gap-3">
                                    <span className="w-4 h-[1px] bg-blue-500"></span>
                                    Arquitetura Bio-Lógica
                                </h3>

                                <div className="space-y-8">
                                    <div className="group">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Ritmo de Plasticidade</span>
                                            <span className="text-blue-400 font-bold text-xs">{learningRate.toFixed(2)}</span>
                                        </div>
                                        <input 
                                            type="range" min="0.1" max="1" step="0.05" 
                                            value={learningRate} 
                                            onChange={(e) => setLearningRate(parseFloat(e.target.value))}
                                            className="w-full h-1 bg-white/10 appearance-none rounded-full accent-blue-500" 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <StatBox label="Neurónios" val={nodes.length} />
                                        <StatBox label="Sinapses" val={connections.length} />
                                        <StatBox label="Camadas" val="04" />
                                        <StatBox label="Sinais Ativos" val={activeSignals.length} color="text-emerald-400" />
                                    </div>
                                </div>

                                <div className="mt-auto space-y-4">
                                    <div className="p-4 bg-white/5 border border-white/10 rounded-2xl">
                                        <h4 className="text-[10px] font-bold text-blue-400 mb-2 uppercase font-mono">Consolidação Hebbiana</h4>
                                        <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                            A rede fortalece conexões usadas com frequência. Clique nos neurónios da primeira camada (esquerda) para iniciar o fluxo de consciência.
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => window.location.reload()}
                                        className="w-full py-3 bg-red-500/10 border border-red-500/20 text-[10px] font-mono text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all uppercase tracking-widest"
                                    >
                                        Limpar Memória da Rede
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* Visualizador de Inferência Ativa */}
                        <main className="flex-1 relative bg-black/40 rounded-[3rem] border border-white/10 overflow-hidden group shadow-[inset_0_0_80px_rgba(0,0,0,0.8)]">
                             {/* Camada de Guia Narrativo */}
                             <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                                <p className="text-lg md:text-2xl font-light italic text-blue-400/10 text-center max-w-lg px-8 transition-opacity duration-1000">
                                    "{GUIDE_MESSAGES[guideIndex]}"
                                </p>
                            </div>

                            <svg className="w-full h-full relative z-10" viewBox="0 0 100 100" preserveAspectRatio="none">
                                {/* Definições de Gradientes */}
                                <defs>
                                    <radialGradient id="nodeActive" cx="50%" cy="50%" r="50%">
                                        <stop offset="0%" stopColor="#fff" />
                                        <stop offset="100%" stopColor="#3b82f6" />
                                    </radialGradient>
                                </defs>

                                {/* Camada de Sinapses (Conexões) */}
                                {connections.map(conn => {
                                    const fromNode = nodes.find(n => n.id === conn.from);
                                    const toNode = nodes.find(n => n.id === conn.to);
                                    if (!fromNode || !toNode) return null;

                                    const strength = Math.abs(conn.weight);
                                    const opacity = 0.05 + strength * 0.3;
                                    const color = conn.weight > 0 ? '59,130,246' : '236,72,153';

                                    return (
                                        <line 
                                            key={conn.id}
                                            x1={fromNode.x} y1={fromNode.y} 
                                            x2={toNode.x} y2={toNode.y} 
                                            stroke={`rgba(${color}, ${opacity})`}
                                            strokeWidth={0.1 + strength * 0.4}
                                            className="transition-all duration-700"
                                        />
                                    );
                                })}

                                {/* Camada de Partículas de Sinal (Realismo de Fluxo) */}
                                {activeSignals.map(sig => (
                                    <circle 
                                        key={sig.id}
                                        r="0.4"
                                        fill="#fff"
                                        className="signal-particle node-glow"
                                        style={{
                                            '--path': `'${sig.path}'`,
                                            '--duration': `${sig.duration}s`
                                        }}
                                    />
                                ))}

                                {/* Camada de Neurónios (Nós) */}
                                {nodes.map(node => {
                                    const isInput = node.layer === 0;
                                    const isOutput = node.layer === 3;
                                    const isActive = node.activation > 0.5;

                                    return (
                                        <g key={node.id} 
                                           onClick={() => isInput && triggerInference(node.id)}
                                           className={`${isInput ? 'cursor-pointer' : 'cursor-default'} group/node`}
                                        >
                                            {/* Glow de Ativação */}
                                            {isActive && (
                                                <circle cx={node.x} cy={node.y} r="3" fill="rgba(59,130,246,0.2)" className="animate-pulse" />
                                            )}
                                            
                                            {/* Corpo do Neurónio */}
                                            <circle 
                                                cx={node.x} cy={node.y} r={isInput ? "1.6" : "1.2"} 
                                                fill={isActive ? "url(#nodeActive)" : "#010409"}
                                                stroke={isActive ? "#fff" : (isInput ? "#3b82f6" : "rgba(59,130,246,0.3)")}
                                                strokeWidth="0.25"
                                                className="transition-all duration-300"
                                            />

                                            {/* Rótulo de Input */}
                                            {isInput && (
                                                <text x={node.x - 5} y={node.y} fill="rgba(59,130,246,0.5)" fontSize="1.5" textAnchor="end" className="font-mono uppercase select-none">DISPARAR</text>
                                            )}
                                            {isOutput && (
                                                <text x={node.x + 4} y={node.y} fill="rgba(16,185,129,0.5)" fontSize="1.5" textAnchor="start" className="font-mono uppercase select-none">SAÍDA</text>
                                            )}
                                        </g>
                                    );
                                })}
                            </svg>

                            {/* HUD de Monitorização de Pesos */}
                            <div className="absolute top-8 left-1/2 -translate-x-1/2 flex gap-8 z-20 pointer-events-none">
                                <div className="text-center">
                                    <p className="text-[7px] font-mono text-blue-500 uppercase tracking-[0.3em]">Conexões Excitatórias</p>
                                    <div className="w-20 h-0.5 bg-blue-500/30 mt-1"></div>
                                </div>
                                <div className="text-center">
                                    <p className="text-[7px] font-mono text-pink-500 uppercase tracking-[0.3em]">Conexões Inibitórias</p>
                                    <div className="w-20 h-0.5 bg-pink-500/30 mt-1"></div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Footer Consolidado Afrokódica */}
                    <footer className="mt-6 flex flex-wrap justify-between items-center gap-6 text-[10px] font-mono text-slate-500 uppercase tracking-widest px-4">
                        <div className="flex gap-10 items-center">
                            <div className="flex flex-col">
                                <span className="text-[8px] text-slate-600 mb-0.5">Sistemas de Inferência</span>
                                <span className="text-blue-400 font-bold tracking-tighter">AFRO_NEURAL_CORE // 2.0</span>
                            </div>
                            <div className="flex flex-col">
                                <span className="text-[8px] text-slate-600 mb-0.5">Nó de Consciência</span>
                                <span className="text-white/80">Namibe_Sinapse_Center</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4 bg-blue-900/10 px-6 py-2 rounded-full border border-blue-500/10 shadow-lg">
                            <span className="text-emerald-500 font-bold animate-pulse">●</span>
                            <span className="text-slate-300">Estado: Processamento Bio-Virtual Ativo</span>
                        </div>
                    </footer>
                </div>
            );
        }

        const StatBox = ({ label, val, color = "text-white" }) => (
            <div className="p-3 bg-white/5 border border-white/5 rounded-xl">
                <p className="text-[7px] text-slate-500 uppercase font-mono mb-1">{label}</p>
                <p className={`text-xs font-bold ${color}`}>{val}</p>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
